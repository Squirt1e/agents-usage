[workspace]
resolver = "2"
members = [
  "crates/usage-core",
  "crates/usage-service",
  "src-tauri"
]

[workspace.package]
version = "1.2.3"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/Squirt1e/agents-usage"

[workspace.dependencies]
usage-core = { path = "crates/usage-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "signal", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
fs2 = "0.4"
libc = "0.2"
base64 = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
regex = "1"
sha2 = "0.10.9"
rand = "0.9.5"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
