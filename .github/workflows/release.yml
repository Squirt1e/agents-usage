# main 的每次推送先判断「这个版本是不是已经发过包」：没发过才打包，发过就只跑门禁。
# 一个版本只出一次包，release 上的 dmg 与它 tag 指向的提交从此是对得上的同一份代码。
#
# 为什么只在 macOS 上跑：交付物只有 .app 与 .dmg，Tauri 只能在 macOS 上出这两种包。
# 为什么是 universal：README 承诺的发布包是 Intel 与 Apple Silicon 通用的单一 dmg。
#   `scripts/desktop/build-service.mjs` 按 `TAURI_ENV_TARGET_TRIPLE` 判断要不要同时编译
#   两份 sidecar 再用 lipo 合并，`--target universal-apple-darwin` 正是它的入口。
# 为什么版本号只出现在 package.json：`src-tauri/tauri.conf.json` 的 version 写成
#   `../package.json`，Tauri 打包时直接读它（落到 CFBundleShortVersionString）。因此这里
#   不写第二份版本号，tag 与资产名都由读出来的那个值决定。
#
# release 正文随版本号提交在 `docs/release-notes/v<version>.md`（骨架见 TEMPLATE.md），
# 流水线只把这份已提交的正文贴上去并直接发布：不生成正文、不改已发出去的 release，也不留
# 一个等人收尾的 draft。正文里不写校验和——资产页上的 SHA-256 由 GitHub 现算，写死会随任何
# 重新上传过期。这与「版本没变就不打包」是同一件事的两半：资产一旦发出就不再变动。
name: release

on:
  push:
    branches: [main]

# 发布必须串行：两个并发 run 会同时判断同一个版本，再同时去建同名 release。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # 读 package.json 的版本号，并决定这次推送要不要出包。
    # 判据是这个版本有没有发过：`v<version>` 这个 tag 或被它标着的 release 已经存在，
    # 就说明发过了。`gh release view` 连手工建的 draft 也看得见，所以别人先建了草稿时
    # 重复推送不会再打一次包。要出包还得有正文：`docs/release-notes/v<version>.md` 缺了就
    # 在这里失败，不往下走。
    #
    # 修一个发出去了但有问题的版本：删掉它的 release 与 tag 再重跑本次 run
    # （`gh release delete v1.2.0 --cleanup-tag --yes`），判断会重新变回「要打包」。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      pack: ${{ steps.read.outputs.pack }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 读出版本号，判断这个版本是否已经发过包
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1 ||
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "### \`$tag\` 已经存在：这个版本发过包了，这次推送不出包" >> "$GITHUB_STEP_SUMMARY"
          else
            # 正文缺失是提交时就能发现的问题：在这里失败，别先花掉 macOS 上一整轮构建。
            # 失败不留半成品——什么都没建，补上文件再推一次，判定仍是「要打包」。
            notes="docs/release-notes/$tag.md"
            if [[ ! -f "$notes" ]]; then
              echo "::error::缺少 $notes，正文要随版本号一起提交（骨架见 docs/release-notes/TEMPLATE.md）" >&2
              exit 1
            fi
            echo "pack=true" >> "$GITHUB_OUTPUT"
            echo "### \`$tag\` 还不存在：这次推送会打包，并用 $notes 当正文直接发布" >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    # main 的常规门禁：类型、风格与测试全过才允许出包（AGENTS.md 要求的三条命令）。
    # 出不出包与它无关，所以每次都跑。
    #
    # Rust 侧的检查（rust:check / rust:test / rust:clippy）仍留在本地：宿主依赖 macOS 专有
    # 框架，Linux runner 上跑不了；放到 macOS 上又要为同一份 workspace 再编译一遍，而下面的
    # 发布作业本来就会编译 release 二进制，编译错误在那里一定会暴露。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  release:
    needs: [plan, verify]
    # 版本没变就整段跳过：不重新打包，也不去碰已经发出去的 release。
    if: needs.plan.outputs.pack == 'true'
    runs-on: macos-latest
    timeout-minutes: 90 # release 构建是 lto + codegen-units = 1，慢是正常的；挂了别占满默认的 6 小时
    permissions:
      contents: write # 建 tag 与 release、挂 dmg
    env:
      # `tools/cargo.sh` 与 `tools/tauri.sh` 都把 CARGO_HOME 指到 `AGENTS_USAGE_CARGO_HOME`
      # （默认是仓库内的 .dsh/cargo-home）。流水线里所有 cargo 都从这两个包装脚本进，所以只覆盖
      # 这一个变量就够了：缓存步骤按固定路径把 registry 与 target 一起收进来，也不去动 rustup
      # 自己的 CARGO_HOME 语义。
      AGENTS_USAGE_CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 通用二进制要两个架构的标准库：runner 自己是 arm64，另一份靠 rustup 装上。
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # release 构建是整条流水线最贵的一步（lto + codegen-units=1），缓存按 Cargo.lock 走：
      # 依赖没动就只重编本仓库的 crate。
      - uses: actions/cache@v6
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.arch }}-
      - run: npm ci
      - name: 打包通用 dmg
        run: npm run build:desktop -- --target universal-apple-darwin
      - name: 建这个版本的 release（正文用仓库里那份已提交的）
        # 这里刻意不生成正文：正文由人写、随版本号一起提交，流水线只负责贴上去并发布。
        # plan 已经确认过正文文件在这个 commit 上存在。
        run: |
          set -eo pipefail
          tag="v${{ needs.plan.outputs.version }}"
          notes="docs/release-notes/$tag.md"
          shopt -s nullglob
          # Tauri 的出包名是 `<productName>_<version>_universal.dmg`，GitHub 上传时会把
          # 文件名里的空格写成点。多于一个 dmg 说明构建产出了预期之外的东西，直接失败。
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "expected exactly one dmg, found ${#dmgs[@]}" >&2
            exit 1
          fi
          # plan 已经确认过这个 tag 不存在；万一构建期间它冒出来了（别人建的 release、
          # 或者同一版本被手工打过标签），宁可失败也不去覆盖那些已经发出去的资产。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag 已经存在，流水线不替换已发布版本的资产；要重新发版请升 package.json 的版本号" >&2
            exit 1
          fi
          # 一次建成发布版：正文已经随版本提交了，没有第二步等人补写，之后再回来改它。
          gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" \
            --notes-file "$notes" "${dmgs[0]}"
          echo "created $tag with $(basename "${dmgs[0]}")"
